<div class="page-container fade-in">
  <div class="page-header">
    <h1 class="page-title">System Settings</h1>
    <p class="page-subtitle">Configure global system preferences and policies</p>
  </div>

  <!-- General Settings -->
  <div class="settings-section">
    <div class="section-header">
      <div class="section-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09"/></svg>
      </div>
      <div class="section-info">
        <h2 class="section-title">General</h2>
        <p class="section-desc">Core system configuration</p>
      </div>
    </div>
    <div class="section-body">
      <div class="setting-row">
        <div class="setting-field">
          <label class="setting-label">System Name</label>
          <input type="text" class="text-input" [(ngModel)]="systemName" />
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-field">
          <label class="setting-label">Support Email</label>
          <input type="email" class="text-input" [(ngModel)]="supportEmail" />
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-field">
          <label class="setting-label">Default Ticket Priority</label>
          <div class="select-wrapper">
            <select class="filter-select" [(ngModel)]="defaultPriority">
              <option value="LOW">Low</option>
              <option value="MEDIUM">Medium</option>
              <option value="HIGH">High</option>
            </select>
            <svg class="select-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>
      </div>
      <div class="section-footer">
        <button class="btn-primary" (click)="saveGeneral()">Save General Settings</button>
      </div>
    </div>
  </div>

  <!-- Notification Settings -->
  <div class="settings-section">
    <div class="section-header">
      <div class="section-icon notification-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <div class="section-info">
        <h2 class="section-title">Notifications</h2>
        <p class="section-desc">Email alerts and automation rules</p>
      </div>
    </div>
    <div class="section-body">
      <app-toggle-switch label="Global Email Notifications" description="Enable email notifications system-wide for all users"
        [value]="globalEmailNotifications" (toggled)="globalEmailNotifications = $event" />
      <app-toggle-switch label="Auto-Assignment" description="Automatically assign new tickets to available agents using round-robin"
        [value]="autoAssignment" (toggled)="autoAssignment = $event" />
      <div class="setting-row">
        <div class="setting-field">
          <label class="setting-label">Escalation After (hours)</label>
          <input type="number" class="text-input num-input" [(ngModel)]="escalationAfterHours" min="1" max="720" />
        </div>
      </div>
      <app-toggle-switch label="Notify Admin on Escalation" description="Send an alert to admin when a ticket is escalated"
        [value]="notifyAdminOnEscalation" (toggled)="notifyAdminOnEscalation = $event" />
      <div class="section-footer">
        <button class="btn-primary" (click)="saveNotifications()">Save Notification Settings</button>
      </div>
    </div>
  </div>

  <!-- Security Settings -->
  <div class="settings-section">
    <div class="section-header">
      <div class="section-icon security-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="section-info">
        <h2 class="section-title">Security</h2>
        <p class="section-desc">Password policies and session management</p>
      </div>
    </div>
    <div class="section-body">
      <div class="setting-row">
        <div class="setting-field">
          <label class="setting-label">Minimum Password Length</label>
          <input type="number" class="text-input num-input" [(ngModel)]="minPasswordLength" min="6" max="32" />
        </div>
      </div>
      <app-toggle-switch label="Require Special Characters" description="Passwords must contain at least one special character (!&#64;#$%)"
        [value]="requireSpecialChars" (toggled)="requireSpecialChars = $event" />
      <div class="setting-row">
        <div class="setting-field">
          <label class="setting-label">Session Timeout (minutes)</label>
          <input type="number" class="text-input num-input" [(ngModel)]="sessionTimeoutMinutes" min="5" max="1440" />
        </div>
      </div>
      <app-toggle-switch label="Enforce Two-Factor Authentication" description="Require 2FA for all users when logging in"
        [value]="enforce2FA" (toggled)="enforce2FA = $event" />
      <div class="section-footer">
        <button class="btn-primary" (click)="saveSecurity()">Save Security Settings</button>
      </div>
    </div>
  </div>
</div>
