# ==============================================================================
# TEST ENVIRONMENT CONFIGURATION (Isolated In-Memory H2)
# ==============================================================================
spring.application.name=tixmanager-test
server.port=0

# In-Memory H2 Datasource for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate & JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Spring Boot Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.mail.enabled=false
management.info.env.enabled=true

# Security & JWT
jwt.secret=9a4f2c8d3b7a1e5f8c6b2d4a7e9f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# File Storage
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.storage.type=local
app.storage.local.base-dir=uploads/attachments-test
app.storage.max-file-size-bytes=10485760

# Disabled Background Scheduled Jobs during testing
app.mail.enabled=false
app.audit.purge.enabled=false
app.sla.escalation-enabled=false

# SLA Settings
app.sla.high-hours=4
app.sla.medium-hours=24
app.sla.low-hours=72
app.sla.warning-hours=2

# CORS
cors.allowed-origins=*
