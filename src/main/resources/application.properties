# Server & Application Configuration
spring.application.name=tixmanager
server.port=8080

# H2 Database Connection Settings (Local Development)
spring.datasource.url=jdbc:h2:mem:tixmanagerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HikariCP Connection Pool Optimization (Scalability & Concurrency Sizing)
# - maximum-pool-size: 20 prevents thread starvation during traffic bursts.
# - minimum-idle: 5 keeps warm connections ready without cold-start handshake delay.
# - idle-timeout: 300000 (5 min) releases unused connections to conserve memory.
# - connection-timeout: 20000 (20s) rejects promptly on exhaustion instead of indefinite hanging.
# - max-lifetime: 1200000 (20 min) prevents stale connection / TCP socket degradation.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=TixManagerHikariCP

# H2 Console Configuration (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings & JDBC Batching Optimization
# - batch_size: Groups 50 inserts/updates per round-trip instead of 1-by-1 queries.
# - order_inserts / order_updates: Ensures statements are grouped by table to enable JDBC batching.
# - batch_versioned_data: Allows optimistic locking (@Version) entities to participate in batching.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# JWT Custom Properties (Used for stateless Token security)
# REMINDER FOR DEPLOYMENT (Phase 2):
# In production, do NOT use this hardcoded default secret. Supply a secure 256-bit key via environment variable:
# e.g., jwt.secret=${JWT_SECRET}
jwt.secret=9a4f2c8d3b7a1e5f8c6b2d4a7e9f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f
# Short-lived Access Token: 15 minutes (OWASP ASVS §3.5)
jwt.expiration-ms=900000
# Database-backed Refresh Token: 7 days
jwt.refresh-expiration-ms=604800000

# SpringDoc OpenAPI / Swagger UI Configuration
# Set SWAGGER_UI_ENABLED=false / SWAGGER_API_DOCS_ENABLED=false in production environment to disable endpoints completely
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Spring Boot Actuator Observability & Health Monitoring (Cloud-Native Kubernetes Probes)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.mail.enabled=false
management.info.env.enabled=true

# Asynchronous Email Notification & SMTP Relay Configuration
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@tixmanager.com}
app.mail.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}

# Spring Boot Starter Mail (JavaMailSender) Transport Settings
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Thymeleaf Template Engine Settings (HTML Email rendering)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Audit & Login History Table Purge Configuration
app.audit.purge.enabled=${AUDIT_PURGE_ENABLED:true}
app.audit.purge.cron=${AUDIT_PURGE_CRON:0 0 2 * * ?}
app.audit.retention-days=${AUDIT_RETENTION_DAYS:90}
app.audit.login-history-retention-days=${LOGIN_HISTORY_RETENTION_DAYS:60}
app.audit.purge-batch-size=${AUDIT_PURGE_BATCH_SIZE:1000}

# CORS Allowed Origins (Comma-separated patterns, overridable via environment variable)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Multipart File Upload Limits (Up to 10MB per attachment, 20MB per request)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# File & Screenshot Storage Configuration (Local disk default, S3 pluggable)
app.storage.type=${STORAGE_TYPE:local}
app.storage.local.base-dir=${STORAGE_BASE_DIR:uploads/attachments}
app.storage.max-file-size-bytes=10485760

