# Server & Application Configuration
spring.application.name=tixmanager
server.port=8080

# H2 Database Connection Settings (Local Development)
spring.datasource.url=jdbc:h2:mem:tixmanagerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Custom Properties (Used for stateless Token security)
# REMINDER FOR DEPLOYMENT (Phase 2):
# In production, do NOT use this hardcoded default secret. Supply a secure 256-bit key via environment variable:
# e.g., jwt.secret=${JWT_SECRET}
jwt.secret=9a4f2c8d3b7a1e5f8c6b2d4a7e9f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f
jwt.expiration-ms=86400000

# SpringDoc OpenAPI / Swagger UI Configuration
# Set SWAGGER_UI_ENABLED=false / SWAGGER_API_DOCS_ENABLED=false in production environment to disable endpoints completely
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

